<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Log de Treinos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <!-- Seção de Login com Alinhamento ao Centro e GIF Responsivo -->
        <div id="authSection" class="auth-center">
            <h2>💪🏼 Treino DB 🏋️</h2>
            <p>Faça login para salvar seus pesos e repetições.</p>
            <button class="btn-google" onclick="login()">Entrar com Google</button>
            <hr>
            <p class="loading-text">Já fez login antes?<br>Aguarde enquanto carregamos o treino!</p>
            <img src="images/load.gif" alt="Carregando..." class="load-gif">
        </div>

        <!-- Seção Principal App -->
        <div id="appSection" class="hidden">
            <div class="app-header">
                <h3 id="userName">Olá!</h3>
                <div class="header-actions">
                    <button class="btn-todos-top" onclick="filtrar('Todos')">Todos</button>
                    <button onclick="logout()" class="btn-sair">Sair</button>
                </div>
            </div>

            <input type="hidden" id="treinoId">
            <input type="text" id="exercicio" placeholder="Nome do Exercício">
            
            <div class="row">
                <input type="number" id="peso" placeholder="Peso (kg)">
                <input type="number" id="repeticoes" placeholder="Reps">
            </div>

            <select id="tagTreino">
                <option value="Geral">Geral</option>
                <option value="T1">T1 - Peito e Ombro</option>
                <option value="T2">T2 - Quadríceps</option>
                <option value="T3">T3 - Costas e Bíceps</option>
                <option value="T4">T4 - Posterior</option>
                <option value="T5">T5 - Glúteo/Peito</option>
            </select>
            <button id="btnSalvar" onclick="salvarTreino()">Salvar Registro</button>

            <hr>

            <div class="filters">
                <button onclick="filtrar('Geral')">Geral</button>
                <button onclick="filtrar('T1')">T1</button>
                <button onclick="filtrar('T2')">T2</button>
                <button onclick="filtrar('T3')">T3</button>
                <button onclick="filtrar('T4')">T4</button>
                <button onclick="filtrar('T5')">T5</button>
            </div>

            <div id="historico"></div>
        </div>
    </div>

    <!-- Script Principal (Módulo JS Externo) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
